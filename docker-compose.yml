services:
  news-collector:
    build: .
    container_name: trading_news_collector
    environment:
      - TZ=Asia/Jakarta
    volumes:
      - ./data:/app/data
      - ./scripts:/app/scripts
    command: python scripts/daily_news_collector.py

  backtest:
    build: .
    container_name: trading_backtest
    environment:
      - TZ=Asia/Jakarta
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    env_file:
      - .env
    command: python main.py --mode backtest --help

  live:
    build: .
    container_name: trading_live
    environment:
      - TZ=Asia/Jakarta
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    env_file:
      - .env
    command: python main.py --mode live --help