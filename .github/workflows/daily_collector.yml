name: Daily News Collector (Cloud Automation)

on:
  schedule:
    # 04:00 UTC = 11:00 WIB (Asia/Jakarta) setiap hari
    - cron: '0 4 * * *'
  workflow_dispatch: # Memungkinkan tombol 'Run workflow' manual di tab Actions GitHub

jobs:
  collect-news:
    name: Collect and Clean Financial News
    runs-on: ubuntu-latest

    permissions:
      contents: write # Diperlukan untuk commit dan push pembaruan master_news.json

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t trading-collector:latest .

      - name: Run Collector Container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/data:/app/data \
            trading-collector:latest

      - name: Commit and Push Updated Cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cache/
          # Commit hanya jika ada berita baru yang bertambah
          if git diff --staged --quiet; then
            echo "Tidak ada berita baru hari ini. Cache tetap up-to-date."
          else
            git commit -m "chore(data): auto-update master news cache via cloud container [skip ci]"
            git push origin main
          fi
